<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOT · Leitor</title>
<style>
  :root { --ink:#1a1a1a; --muted:#5f5e5a; --line:#d3d1c7; --accent:#f8d52d; --ok:#2e7d32; --bad:#b33000; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.4 system-ui, sans-serif; color:var(--ink); background:#fff; }
  header { background:var(--accent); padding:12px 16px; font-weight:700; }
  main { padding:16px; max-width:560px; margin:auto; }
  .tasks { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:16px; }
  .tasks button { padding:14px 4px; border:1px solid var(--line); border-radius:8px; background:#fff; font-size:15px; }
  .tasks button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  input, select, textarea { width:100%; padding:12px; font-size:16px; border:1px solid var(--line); border-radius:8px; }
  textarea { height:120px; font-family:ui-monospace, monospace; font-size:13px; }
  .count { font-size:40px; font-weight:700; text-align:center; margin:12px 0; }
  .go { width:100%; padding:16px; font-size:18px; font-weight:700; border:0; border-radius:8px; background:var(--ink); color:#fff; margin-top:12px; }
  .sub { width:100%; padding:12px; margin-top:8px; border:1px solid var(--ink); border-radius:8px; background:#fff; font-size:16px; }
  .hide { display:none; }
  #out { margin-top:16px; padding:12px; border-radius:8px; background:#f1efe8; white-space:pre-wrap; font-size:14px; }
  #out.ok { border-left:4px solid var(--ok); } #out.bad { border-left:4px solid var(--bad); }
</style>
</head>
<body>
<header>TOT · Leitor RFID</header>
<main>
  <div class="tasks">
    <button data-t="ship" class="on">Expedir</button>
    <button data-t="receive">Receber</button>
    <button data-t="count">Contar</button>
    <button data-t="dispose">Quebra</button>
  </div>

  <label for="user">Utilizador</label>
  <input id="user" placeholder="nome">

  <div data-for="ship">
    <label for="from">De → Para</label>
    <div style="display:flex;gap:8px"><input id="from" value="DC"><input id="to" value="LOJA-1"></div>
    <button class="sub" id="newShip">Nova expedição</button>
  </div>
  <div data-for="ship receive">
    <label for="sid">Expedição</label>
    <input id="sid" placeholder="SHP-…">
  </div>
  <div data-for="count dispose" class="hide">
    <label for="loc">Local</label>
    <input id="loc" value="LOJA-1">
  </div>
  <div data-for="dispose" class="hide">
    <label for="kind">Tipo</label>
    <select id="kind"><option value="waste">Quebra</option><option value="own_use">Consumo próprio</option></select>
    <label for="reason">Motivo</label>
    <input id="reason" placeholder="ex.: validade expirada">
  </div>

  <label for="reads">Leituras (o leitor escreve aqui)</label>
  <textarea id="reads" autofocus></textarea>
  <div class="count"><span id="n">0</span> etiquetas</div>
  <button class="sub" id="clear">Limpar leituras</button>

  <button class="go" id="send">Enviar</button>

  <div data-for="ship">
    <label for="guia">Guia de transporte</label>
    <input id="guia" placeholder="GT 2026/…">
    <label for="atcud">ATCUD</label>
    <input id="atcud">
    <button class="sub" id="dispatch">Fechar e expedir</button>
  </div>

  <div id="out" class="hide"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const EPC = /\b30[0-9A-F]{22}\b/g;
let task = 'ship';

function unique() { return [...new Set(($('reads').value.toUpperCase().match(EPC) || []))]; }
function refresh() { $('n').textContent = unique().length; }
function show(text, ok) { const o = $('out'); o.textContent = text; o.className = ok ? 'ok' : 'bad'; }

async function call(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ detail: r.statusText }));
  if (!r.ok) throw new Error(j.detail || 'erro');
  return j;
}

document.querySelectorAll('.tasks button').forEach(b => b.onclick = () => {
  task = b.dataset.t;
  document.querySelectorAll('.tasks button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('[data-for]').forEach(el => el.classList.toggle('hide', !el.dataset.for.split(' ').includes(task)));
  $('reads').focus();
});

$('reads').addEventListener('input', refresh);
$('clear').onclick = () => { $('reads').value = ''; refresh(); $('reads').focus(); };

$('newShip').onclick = async () => {
  try { const j = await call('/shipments', { from_location: $('from').value, to_location: $('to').value });
        $('sid').value = j.shipment_id; show('Expedição criada: ' + j.shipment_id, true); }
  catch (e) { show(e.message, false); }
};

$('send').onclick = async () => {
  const reads = unique().join('\n'), user = $('user').value || 'operador';
  if (!reads) return show('Sem leituras.', false);
  try {
    let j, text;
    if (task === 'ship') {
      j = await call(`/shipments/${$('sid').value}/pick`, { reads, user });
      text = `Adicionadas: ${j.added}\nRejeitadas: ${Object.keys(j.rejected).length}\n\n` +
             j.lines.map(l => `${l[0]}  ${l[2]}  × ${l[3]}`).join('\n');
    } else if (task === 'receive') {
      j = await call(`/shipments/${$('sid').value}/receive`, { reads, user });
      const estado = { received: 'Recebida completa', discrepancy: 'Divergência — faltam etiquetas' }[j.status] || j.status;
      text = `${estado}\nRecebidas: ${j.matched}\nEm falta: ${j.missing.length}\nA mais: ${j.extra.length}`;
    } else if (task === 'count') {
      j = await call('/counts', { reads, user, location_id: $('loc').value });
      text = j.lines.map(l => `${l.item_code}  lidas ${l.physical} / esperadas ${l.expected}`).join('\n') +
             `\n\nFora do sítio: ${j.misplaced.length}\nNovas em falta: ${j.newly_missing.length}`;
    } else {
      if (!$('reason').value) return show('Indique o motivo.', false);
      j = await call('/dispose', { reads, user, location_id: $('loc').value, kind: $('kind').value, reason: $('reason').value });
      text = 'Registado. Ficheiro para StoresAce: ' + j.export_file;
    }
    show(text, true); $('reads').value = ''; refresh();
  } catch (e) { show(e.message, false); }
};

$('dispatch').onclick = async () => {
  if (!$('guia').value) return show('Indique o número da guia de transporte.', false);
  try { const j = await call(`/shipments/${$('sid').value}/dispatch`,
          { guia_no: $('guia').value, atcud: $('atcud').value || null, user: $('user').value || 'operador' });
        show('Expedida. Ficheiro de transferência: ' + j.transfer_file, true); }
  catch (e) { show(e.message, false); }
};
</script>
</body>
</html>
